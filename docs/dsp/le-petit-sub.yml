# Le Petit + Le Petit Sub - CamillaDSP v4, example pipeline
# Generated by tools/make_charts.py from the driver datasheet and the box. A STARTING POINT:
# set sub_level, sub_delay and limiter_db by measurement (docs/02-amp-and-dsp.md).
#
# Outputs: 0 = Le Petit L, 1 = Le Petit R, 2 = sub (mono, Y-cable to both TPA3255 inputs),
#          3 = sub copy (optional: the second TPA3255 input from its own output instead of a Y-cable)
# Keep your own `devices:` section - only the playback device needs 4 channels.

devices:
  samplerate: 48000
  chunksize: 1024
  capture:
    type: Stdin            # replace with your capture device
    channels: 2
    format: S32_LE
  playback:
    type: Stdout           # replace with your 4-channel output (e.g. UMC404HD)
    channels: 4
    format: S32_LE

mixers:
  to_sub:
    channels: {in: 2, out: 4}
    mapping:
      - dest: 0
        sources: [{channel: 0, gain: 0, scale: dB}]
      - dest: 1
        sources: [{channel: 1, gain: 0, scale: dB}]
      - dest: 2              # mono sum, -6 dB each: a centred sound keeps its level
        sources: [{channel: 0, gain: -6.02, scale: dB}, {channel: 1, gain: -6.02, scale: dB}]
      - dest: 3
        sources: [{channel: 0, gain: -6.02, scale: dB}, {channel: 1, gain: -6.02, scale: dB}]

filters:
  lepetit_hp:              # Le Petit: high-pass at the crossover (replaces its 36 Hz protection high-pass)
    type: BiquadCombo
    parameters: {type: LinkwitzRileyHighpass, freq: 80, order: 4}
  sub_headroom:            # the filters below boost up to +13.2 dB: make room first
    type: Gain
    parameters: {gain: -14, scale: dB}
  sub_lt:                  # sealed box Fc 67.7 Hz / Qtc 1.06 -> 25 Hz / Q 0.707
    type: Biquad
    parameters: {type: LinkwitzTransform, freq_act: 67.7, q_act: 1.06, freq_target: 25, q_target: 0.707}
  sub_lp:
    type: BiquadCombo
    parameters: {type: LinkwitzRileyLowpass, freq: 80, order: 4}
  sub_subsonic:            # required: keeps the transform's boost off the infrasonic
    type: BiquadCombo
    parameters: {type: ButterworthHighpass, freq: 18, order: 2}
  sub_level:               # set by measurement: sub and Le Petit at the same level round 80 Hz
    type: Gain
    parameters: {gain: 0.0, scale: dB}
  sub_delay:               # set by measurement: the sum at 80 Hz at its loudest
    type: Delay
    parameters: {delay: 0.0, unit: ms, subsample: false}
  sub_limiter:             # 18 V at the amp output: clip_limit = 20 log10(18 / volts at 0 dBFS)
    type: Limiter
    parameters: {clip_limit: -6.0, soft_clip: false}

pipeline:
  - type: Mixer
    name: to_sub
  - type: Filter
    channels: [0, 1]
    names: [lepetit_hp]
  - type: Filter
    channels: [2, 3]
    names: [sub_headroom, sub_lt, sub_lp, sub_subsonic, sub_level, sub_delay, sub_limiter]
