<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 332" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Signal chain: music into CamillaDSP, out of a 4-output interface. Outputs 1 and 2 drive Le Petit through its amp; output 3 feeds both inputs of the TPA3255 board, one channel per sub driver."><style>text{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}.m{font-family:Menlo,Consolas,monospace;font-size:12px}</style><rect width="940" height="332" fill="#ffffff"/><rect x="20" y="120" width="130" height="60" rx="7" fill="#ffffff" stroke="#16181a" stroke-width="1.5"/><text x="85.0" y="146.0" font-size="14" text-anchor="middle" fill="#16181a">Music</text><text x="85.0" y="163.0" font-size="11.5" text-anchor="middle" fill="#5b5f63">stereo source</text><rect x="200" y="110" width="170" height="80" rx="7" fill="#ffffff" stroke="#16181a" stroke-width="1.5"/><text x="285.0" y="146.0" font-size="14" text-anchor="middle" fill="#16181a" font-weight="600">CamillaDSP</text><text x="285.0" y="163.0" font-size="11.5" text-anchor="middle" fill="#5b5f63">crossover · LT · limiter</text><rect x="420" y="60" width="150" height="180" rx="7" fill="#ffffff" stroke="#16181a" stroke-width="1.5"/><text x="495.0" y="84" font-size="14" text-anchor="middle" fill="#16181a" font-weight="600">4-out interface</text><rect x="650" y="30" width="120" height="56" rx="7" fill="#ffffff" stroke="#16181a" stroke-width="1.5"/><text x="710.0" y="54.0" font-size="14" text-anchor="middle" fill="#16181a">Le Petit amp</text><text x="710.0" y="71.0" font-size="11.5" text-anchor="middle" fill="#5b5f63">stereo</text><rect x="650" y="190" width="120" height="70" rx="7" fill="#ffffff" stroke="#16181a" stroke-width="1.5"/><text x="710.0" y="221.0" font-size="14" text-anchor="middle" fill="#16181a">TPA3255</text><text x="710.0" y="238.0" font-size="11.5" text-anchor="middle" fill="#5b5f63">stereo board, 48 V</text><rect x="820" y="20" width="100" height="38" rx="7" fill="#ffffff" stroke="#16181a" stroke-width="1.5"/><text x="870.0" y="44.0" font-size="14" text-anchor="middle" fill="#16181a">Le Petit L</text><rect x="820" y="64" width="100" height="38" rx="7" fill="#ffffff" stroke="#16181a" stroke-width="1.5"/><text x="870.0" y="88.0" font-size="14" text-anchor="middle" fill="#16181a">Le Petit R</text><rect x="820" y="176" width="100" height="42" rx="7" fill="#ffffff" stroke="#16181a" stroke-width="1.5"/><text x="870.0" y="202.0" font-size="14" text-anchor="middle" fill="#16181a">sub, left driver</text><rect x="820" y="232" width="100" height="42" rx="7" fill="#ffffff" stroke="#16181a" stroke-width="1.5"/><text x="870.0" y="258.0" font-size="14" text-anchor="middle" fill="#16181a">sub, right driver</text><path d="M150 150 H200" fill="none" stroke="#16181a" stroke-width="1.6"/><path d="M370 150 H420" fill="none" stroke="#16181a" stroke-width="1.6"/><text x="562" y="112" class="m" font-size="13" text-anchor="end" fill="#16181a">OUT 1</text><text x="562" y="136" class="m" font-size="13" text-anchor="end" fill="#16181a">OUT 2</text><text x="562" y="186" class="m" font-size="13" text-anchor="end" fill="#16181a">OUT 3</text><text x="562" y="210" class="m" font-size="13" text-anchor="end" fill="#5b5f63">OUT 4 · spare</text><path d="M570 108 H610 V50 H650" fill="none" stroke="#16181a" stroke-width="1.6"/><path d="M570 132 H620 V66 H650" fill="none" stroke="#16181a" stroke-width="1.6"/><path d="M770 50 H795 V39 H820" fill="none" stroke="#16181a" stroke-width="1.6"/><path d="M770 66 H795 V83 H820" fill="none" stroke="#16181a" stroke-width="1.6"/><path d="M570 182 H630 V212 H650" fill="none" stroke="#c4512a" stroke-width="2.2"/><path d="M630 182 V238 H650" fill="none" stroke="#c4512a" stroke-width="2.2"/><text x="640" y="176" class="s" font-size="13" text-anchor="middle" fill="#c4512a">Y</text><path d="M770 212 H795 V197 H820" fill="none" stroke="#c4512a" stroke-width="2.2"/><path d="M770 238 H795 V253 H820" fill="none" stroke="#c4512a" stroke-width="2.2"/><text x="20" y="300" font-size="12" fill="#5b5f63">Le Petit: LR4 high-pass 80 Hz. Sub: mono sum → Linkwitz transform → LR4 low-pass 80 Hz → 18 Hz subsonic → level, delay → limiter 18 V.</text><text x="20" y="318" font-size="12" fill="#5b5f63">One mono sub output, split to both board inputs (or OUT 3 + OUT 4 with the same signal). Both drivers wired + to +.</text></svg>
